name: novel-os

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_HOME: /root/.codex
      NOVEL_OS_PROJECTS_DIR: /data/projects
      NOVEL_OS_MEDIA_DIR: /data/media
      NOVEL_OS_DB: sqlite:////data/novel_os.db
      NOVEL_OS_SETTINGS_PATH: /data/studio_settings.json
      NOVEL_OS_COVER_BASE_URL: ${NOVEL_OS_COVER_BASE_URL:-}
      NOVEL_OS_COVER_API_KEY: ${NOVEL_OS_COVER_API_KEY:-}
      NOVEL_OS_COVER_MODEL: ${NOVEL_OS_COVER_MODEL:-gpt-image-2}
      NOVEL_OS_COVER_SIZE: ${NOVEL_OS_COVER_SIZE:-2048x3072}
      NOVEL_OS_COVER_QUALITY: ${NOVEL_OS_COVER_QUALITY:-high}
      NOVEL_OS_COVER_FORMAT: ${NOVEL_OS_COVER_FORMAT:-jpeg}
      NOVEL_OS_COVER_COUNT: ${NOVEL_OS_COVER_COUNT:-4}
      NOVEL_OS_COVER_TIMEOUT_SECONDS: ${NOVEL_OS_COVER_TIMEOUT_SECONDS:-300}
      NOVEL_OS_COVER_DIRECTOR_PROVIDER: ${NOVEL_OS_COVER_DIRECTOR_PROVIDER:-}
      NOVEL_OS_COVER_DIRECTOR_MODEL: ${NOVEL_OS_COVER_DIRECTOR_MODEL:-}
      NOVEL_OS_COVER_DIRECTOR_BASE_URL: ${NOVEL_OS_COVER_DIRECTOR_BASE_URL:-}
      NOVEL_OS_COVER_DIRECTOR_API_KEY: ${NOVEL_OS_COVER_DIRECTOR_API_KEY:-}
      NOVEL_OS_COVER_DIRECTOR_TIMEOUT_SECONDS: ${NOVEL_OS_COVER_DIRECTOR_TIMEOUT_SECONDS:-600}
      NOVEL_OS_COVER_DIRECTOR_REASONING_EFFORT: ${NOVEL_OS_COVER_DIRECTOR_REASONING_EFFORT:-}
    volumes:
      # Keep the host path configurable so deploy.sh and the container always
      # read and write the same persistent data directory.
      - ${NOVEL_OS_DATA_DIR:-./docker-data}:/data
      # Codex must persist refreshed ChatGPT session tokens between requests.
      # Fail on missing files instead of silently creating directories for them.
      - type: bind
        source: ${NOVEL_OS_CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}
        target: /root/.codex/auth.json
        bind:
          create_host_path: false
      - type: bind
        source: ${NOVEL_OS_CODEX_CONFIG_FILE:-${HOME}/.codex/config.toml}
        target: /root/.codex/config.toml
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NOVEL_OS_WEB_PORT:-5174}:80"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
