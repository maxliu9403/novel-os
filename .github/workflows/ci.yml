name: CI

# Runs on every push and pull request. The point is that a contributor gets an
# answer from the repository rather than from the maintainer's word: no one
# should have to take "the tests pass on my machine" on trust.
on:
  push:
    branches: [dev, main]
  pull_request:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README claims, and the current release - so the claim
        # is verified rather than asserted.
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Each step is named for what it proves, so a red check says which of the
      # four guarantees broke without anyone opening the log.
      - name: Types
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  deployment:
    name: Docker deployment files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n deploy.sh
          sh -n docker-entrypoint.sh

      - name: Compose configuration
        env:
          NOVEL_OS_DATA_DIR: /tmp/novel-os-data
          NOVEL_OS_CODEX_AUTH_FILE: /tmp/codex/auth.json
          NOVEL_OS_CODEX_CONFIG_FILE: /tmp/codex/config.toml
        run: |
          docker compose config --quiet
          docker compose config --format json | python3 -c '
          import json, os, sys
          volumes = json.load(sys.stdin)["services"]["backend"]["volumes"]
          mounts = {volume["target"]: volume for volume in volumes}
          assert mounts["/data"]["source"] == os.environ["NOVEL_OS_DATA_DIR"]
          for filename, variable in (("auth.json", "NOVEL_OS_CODEX_AUTH_FILE"), ("config.toml", "NOVEL_OS_CODEX_CONFIG_FILE")):
              mount = mounts["/root/.codex/" + filename]
              assert mount["source"] == os.environ[variable]
              assert mount["bind"]["create_host_path"] is False
          '
